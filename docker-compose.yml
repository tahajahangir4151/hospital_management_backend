services:
  postgres:
    image: postgres:18
    container_name: hospital-postgres

    env_file:
      - .env.docker

    ports:
      - "5433:5432"

    volumes:
      - hospital_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d hospital-management"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  backend:
    image: hospital-backend:latest
    container_name: hospital-backend

    env_file:
      - .env.docker

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  hospital_postgres_data: